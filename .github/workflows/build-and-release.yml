name: Build & Release

on:
  push:
    branches: ["main"]
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for git history analysis

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Sync dependencies
        run: uv sync

      - name: Detect semantic version bump from commits
        id: detect-bump
        run: |
          chmod +x .github/scripts/detect-version-bump.sh
          BUMP=$(./.github/scripts/detect-version-bump.sh)
          echo "Detected bump type: $BUMP"
          echo "bump=$BUMP" >> $GITHUB_OUTPUT

      - name: Apply Hatch version bump
        if: steps.detect-bump.outputs.bump != 'none'
        run: |
          BUMP=$(echo "${{ steps.detect-bump.outputs.bump }}" | tr '[:upper:]' '[:lower:]')
          echo "Applying hatch version $BUMP..."
          uvx hatch version $BUMP

      - name: Build distributions
        run: |
          VERSION=$(uvx hatch version)
          echo "Building distributions for v${VERSION}..."
          uvx hatch build --clean

      - name: Create annotated git tag
        if: startsWith(github.ref, 'refs/tags/v') == false  # Only on push, not tag creation
        id: create-tag
        run: |
          VERSION=$(uvx hatch version)
          echo "Creating tag v${VERSION}"
          
          # Check if tag already exists
          if git rev-parse v${VERSION} >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists, skipping creation"
            exit 0
          fi
          
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "v${VERSION}" -m "Release ${VERSION}"
          git push origin "v${VERSION}"

      - name: Publish to PyPI
        if: steps.detect-bump.outputs.bump != 'none' && steps.create-tag.conclusion == 'success'
        run: |
          VERSION=$(uvx hatch version)
          echo "Publishing v${VERSION} to PyPI..."
          
          # Use uv publish with id-token authentication (GitHub Actions trusted publishing)
          uv publish --token ${{ secrets.PYPI_API_TOKEN }}

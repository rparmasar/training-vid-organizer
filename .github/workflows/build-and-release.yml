name: Build & Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version using bump-my-version
        id: bump
        uses: callowayproject/bump-my-version@master
        with:
          args: ""
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if version was bumped
        if: steps.bump.outputs.bumped == 'true'
        run: |
          echo "Version bumped from ${{ steps.bump.outputs.previous-version }}" \
               "to ${{ steps.bump.outputs.current-version }}"

      - name: Build distributions (only on bump)
        if: steps.bump.outputs.bumped == 'true'
        run: uvx hatch build --clean

      - name: Publish to PyPI (only on bump)
        if: steps.bump.outputs.bumped == 'true'
        run: |
          echo "Publishing ${{ steps.bump.outputs.current-version }} to PyPI..."
          uv publish --token ${{ secrets.PYPI_API_TOKEN }}

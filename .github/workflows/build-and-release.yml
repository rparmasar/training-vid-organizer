name: Build & Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version using bump-my-version
        id: bump
        run: |
          # Install bump-my-version via pip (standard in runners)
          pip install "bump-my-version>=1.4.0"
          
          # Get current version before bump from hatch config
          echo "previous-version=$(python -m hatch.version)" >> $GITHUB_OUTPUT
          
          # Auto-detect and apply version bump from conventional commits
          bump-my-version bump --allow-dirty || exit 1
          
          # Get new version after bump from hatch config
          echo "current-version=$(python -m hatch.version)" >> $GITHUB_OUTPUT
          
          echo "bumped=true" >> $GITHUB_OUTPUT

      - name: Build distributions (only on bump)
        if: steps.bump.outputs.bumped == 'true'
        run: python -m hatch build --clean

      - name: Publish to PyPI (only on bump)
        if: steps.bump.outputs.bumped == 'true'
        run: |
          echo "Publishing ${{ steps.bump.outputs.current-version }} to PyPI..."
          pip install twine
          python -m twine upload --repository-url https://upload.pypi.org/legacy/ \
            --username __token__ --password ${{ secrets.PYPI_API_TOKEN }} dist/*

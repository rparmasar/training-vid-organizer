name: Build & Release

on:
  push:
    branches: ["main"]
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for git history analysis

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Sync dependencies
        run: uv sync

      - name: Calculate next semantic version from commits
        id: calc-version
        run: |
          # Get current version from __about__.py or existing tag
          CURRENT=$(uvx hatch version 2>/dev/null || echo "0.0.0")
          
          # Use custom script to detect bump type from conventional commits
          BUMP_TYPE=$(./.github/scripts/detect-version-bump.sh)
          
          if [ "$BUMP_TYPE" = "none" ]; then
            echo "No version bump detected in recent commits, keeping current version: $CURRENT"
            NEXT_VERSION="$CURRENT"
          else
            # Calculate next semantic version using helper script
            python3 .github/scripts/calculate-version.py \
              --bump-type "$BUMP_TYPE" \
              --current-version "$CURRENT"
            NEXT_VERSION=$(python3 .github/scripts/calculate-version.py \
              --bump-type "$BUMP_TYPE" \
              --current-version "$CURRENT")
          fi
          
          echo "Current version: $CURRENT"
          echo "Next version (from commits): $NEXT_VERSION"
          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT

      - name: Apply calculated version to __about__.py
        run: |
          VERSION="${{ steps.calc-version.outputs.version }}"
          echo "Updating src/training_vid_organizer/__about__.py to v${VERSION}"
          
          # Write new version directly (faster than hatch command)
          printf '"""Package metadata."""\n\n__version__ = "%s"\n' "$VERSION" > src/training_vid_organizer/__about__.py

      - name: Commit version update to main
        if: startsWith(github.ref, 'refs/tags/v') == false  # Only on push, not tag creation
        run: |
          VERSION="${{ steps.calc-version.outputs.version }}"
          
          # Configure git user for the commit
          git config user.name "GitHub Actions"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          
          # Stage and commit the version change
          git add src/training_vid_organizer/__about__.py
          git commit --no-verify -m "[ci skip] bump version to ${VERSION}" || echo "No changes to commit (already up to date)"

      - name: Build distributions
        run: |
          VERSION="${{ steps.calc-version.outputs.version }}"
          echo "Building distributions for v${VERSION}..."
          uvx hatch build --clean

      - name: Create annotated git tag
        if: startsWith(github.ref, 'refs/tags/v') == false  # Only on push, not tag creation
        id: create-tag
        run: |
          VERSION="${{ steps.calc-version.outputs.version }}"
          echo "Creating tag v${VERSION}"
          
          # Check if tag already exists
          if git rev-parse v${VERSION} >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists, skipping creation"
            exit 0
          fi
          
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "v${VERSION}" -m "Release ${VERSION}"
          git push origin "v${VERSION}"

      - name: Publish to PyPI
        if: steps.calc-version.outputs.version != '${{ steps.calc-version.outputs.version }}' && steps.create-tag.conclusion == 'success'
        run: |
          VERSION="${{ steps.calc-version.outputs.version }}"
          echo "Publishing v${VERSION} to PyPI..."
          
          # Use uv publish with id-token authentication (GitHub Actions trusted publishing)
          uv publish --token ${{ secrets.PYPI_API_TOKEN }}

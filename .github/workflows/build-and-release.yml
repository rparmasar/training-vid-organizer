name: Build & Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  id-token: write # For PyPI trusted publishing

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Sync dependencies
        run: uv sync

      # Hatch auto-detects semantic version bump from conventional commits
      - name: Preview version bump (dry-run)
        run: hatch version bump --dry-run

      - name: Build wheel and source distribution
        run: uv run hatch build

      - name: Run test suite with coverage
        run: uv run pytest --cov=src/training_vid_organizer --cov-report=term-missing

      # Hatch applies the auto-detected version bump to pyproject.toml
      - name: Apply version bump
        run: hatch version bump

      # Create and push annotated tag with release notes
      - name: Create & push release tag
        run: |
          NEW_VERSION=$(hatch version)
          git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"
          git push origin main
          git push origin "$NEW_VERSION"

      # Generate simple release notes from git log between tags
      - name: Generate release notes
        run: |
          NEW_VERSION=$(hatch version)
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          
          if [ "$LAST_TAG" = "$NEW_VERSION" ]; then
            echo "No new commits since last release" > .release_notes.md
          else
            git log "${LAST_TAG}..HEAD" --oneline --no-merges | \
              awk '{print "- " $2}' >> .release_notes.md
          fi

      - name: Upload distributions as artifact
        uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ github.ref_name }}
          path: dist/

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-${{ github.ref_name }}
          path: .release_notes.md

  publish-release:
    needs: build-and-release
    runs-on: ubuntu-latest
    
    # Only run when a tag is created (prevents accidental uploads)
    if: startsWith(github.ref, 'refs/tags/v')

    environment: release # Requires manual approval in GitHub UI

    steps:
      - name: Download distributions artifact
        uses: actions/download-artifact@v4
        with:
          name: distributions-main
          path: .

      - name: Validate distributions before upload
        run: uv run twine check dist/*

      # Publish to PyPI using trusted publishing (no secrets needed)
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true

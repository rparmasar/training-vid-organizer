name: CI

on:
  push:
    branches-ignore: ["main"] # Run on all branches except main (CI runs there in build-and-release.yml)
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Sync dependencies
        run: uv sync

      - name: Run lint check
        run: uv run ruff check src/

      - name: Run tests (fail fast)
        run: uv run pytest -x --tb=short

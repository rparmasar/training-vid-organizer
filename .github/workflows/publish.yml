name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Distribution repository (testpypi or pypi)"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/training-vid-organizer/
    permissions:
      contents: read
      id-token: write # For PyPI trusted publishing (modern method)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Sync dependencies
        run: uv sync

      - name: Validate distributions
        run: uv run twine check dist/*

      - name: Upload to PyPI repository
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          REPO=${{ github.event.inputs.repository || 'testpypi' }}
          
          # Use twine with repository option for TestPyPI, or default to PyPI
          if [ "$REPO" = "testpypi" ]; then
            uv run twine upload --repository testpypi dist/*
          else
            uv run twine upload dist/*
          fi

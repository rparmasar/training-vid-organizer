[project]
name = "training-vid-organizer"
version = "0.1.0"
description = "A CLI tool for organizing training videos with metadata extraction, categorization, and search capabilities."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Your Name", email = "you@example.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer[all]>=0.15.0",
    "pydantic>=2.9.0",
]

[project.scripts]
training-vid-organizer = "training_vid_organizer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
